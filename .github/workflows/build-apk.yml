
name: Compilar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TrucoArgentino-Android-corregido.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip -q TrucoArgentino-Android-corregido.zip

      - name: Compilar aplicación
        run: |
          cd TrucoArgentino
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TrucoArgentino-APK
          path: TrucoArgentino/app/build/outputs/apk/debug/app-debug.apk
