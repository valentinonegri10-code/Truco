
name: Generar APK

on:
  push:
    paths:
      - 'TrucoArgentino-Android.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          mkdir -p proyecto
          unzip -q TrucoArgentino-Android.zip -d proyecto
          ls -la proyecto

      - name: Compilar APK
        run: gradle -p proyecto/TrucoArgentino assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TrucoArgentino-APK
          path: proyecto/TrucoArgentino/app/build/outputs/apk/debug/app-debug.apk
