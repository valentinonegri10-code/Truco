name: Generar APK

on:
  push:
    paths:
      - 'TrucoArgentino-Android.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip TrucoArgentino-Android.zip -d proyecto

      - name: Compilar APK
        run: gradle -p proyecto/TrucoArgentino assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TrucoArgentino-APK
          path: proyecto/TrucoArgentino/app/build/outputs/apk/debug/app-debug.apk
